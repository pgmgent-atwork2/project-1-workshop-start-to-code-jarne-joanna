
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Hangman</title>
    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>Learn to Code by Building a Hangman Game</h1>
            <p>The complete beginner's guide to HTML, CSS, and JavaScript</p>
        </header>

        <main class="main">
            <div class="popup">
                <div class="popup__content">
                    <img src="./src/images/victory.gif" alt="gif">
                    <h2>Wrong answer!</h2>
                    <p>The word we needed was: <b>rainbow</b></p>
                    <button class="restart-btn">Play Again</button>
                </div>
            </div>

            <div class="game">
                <div class="drawing">
                    <img src="./src/images/hangman-0.svg" alt="hangman-img">
                    <div class="score">Incorrect guesses: <b>0/6</b></div>
                </div>

                <div class="gameplay">
                    <h4 class="clue">Hint: <b></b></h4>
                    <ul class="letters"></ul>
                    <div class="buttons"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="./src/scripts/word-list.js"></script>
    <script src="./src/scripts/scripts.js"></script>
</body>
</html>
